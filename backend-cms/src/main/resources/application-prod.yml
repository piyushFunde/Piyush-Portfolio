server:
  port: ${PORT:8080}

spring:
  application:
    name: portfolio-cms-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/portfoliodb}
    driverClassName: org.postgresql.Driver
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000

  h2:
    console:
      enabled: false # Strictly disabled in production

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 15MB
      max-request-size: 15MB

cms:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin123}
    email: ${ADMIN_EMAIL:admin@piyushfunde.dev}
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    provider: ${STORAGE_PROVIDER:local} # local, cloudinary, or s3
  cors:
    allowed-origins:
      - "${FRONTEND_URL:https://piyushfunde-portfolio.vercel.app}"
      - "${ADMIN_URL:http://localhost:5174}"
